version: '3.8'

services:
  pixi:
    image: l8tenever/l8tepicture:latest
    container_name: pixi-gallery
    ports:
      - "10.66.66.1:8000:8000"
    volumes:
      # Mapping your existing data folders correctly
      - ./uploads:/pictures:ro
      - ./thumbnails:/cache/grid
      - ./data:/cache/full
      - ./cache:/cache
      - ./music:/music:ro
    environment:
      - PICTURES_DIR=/pictures
      - CACHE_DIR=/cache
      - MUSIC_DIR=/music
      - ENABLE_WATCH=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
