<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>P.I.X.I. | Material You Gallery</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#FEF7FF">

    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Local Styles -->
    <link rel="stylesheet" href="/static/css/material-you.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>

<body class="px-4 sm:px-8 md:px-12 pb-12">

    <!-- Header -->
    <header id="mainHeader" class="max-w-7xl mx-auto flex flex-row justify-between items-center gap-4">
        <div class="text-left">
            <h1 class="text-4xl sm:text-5xl font-black tracking-tighter select-none">P.I.X.I.</h1>
        </div>

        <!-- Control Bar -->
        <div
            class="flex items-center gap-0.5 sm:gap-1 bg-[var(--md-sys-color-surface-container)] p-1 sm:p-1.5 rounded-full shadow-lg relative flex-shrink-0">

            <!-- Dark Mode Toggle -->
            <button id="themeToggle" class="click-feedback p-2 sm:p-3 hover:bg-black/5 rounded-full transition-all">
                <svg id="themeIcon" class="w-[18px] h-[18px] sm:w-[22px] sm:h-[22px]" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>

            <div class="w-[1px] h-4 sm:h-6 bg-gray-400 mx-0.5 sm:mx-1 opacity-20"></div>

            <!-- Grid View Selector -->
            <div class="relative">
                <button id="viewToggle"
                    class="click-feedback flex items-center gap-1 sm:gap-2 hover:bg-black/5 px-2 sm:px-4 py-2 sm:py-2.5 rounded-full transition-all">
                    <svg class="w-[16px] h-[16px] sm:w-[20px] sm:h-[20px]" xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                    </svg>
                    <span id="currentViewLabel" class="font-bold text-xs sm:text-sm hidden sm:inline">3</span>
                </button>
                <div id="viewPopover">
                    <button class="view-option click-feedback" data-cols="1">1</button>
                    <button class="view-option click-feedback" data-cols="2">2</button>
                    <button class="view-option click-feedback active" data-cols="3">3</button>
                    <button class="view-option click-feedback" data-cols="4">4</button>
                    <button class="view-option click-feedback" data-cols="5">5</button>
                </div>
            </div>

            <!-- Slideshow Button -->
            <button id="slideshowBtn"
                class="click-feedback p-2 sm:p-3 hover:bg-black/5 rounded-full transition-all text-[var(--md-sys-color-primary)]">
                <svg class="w-[18px] h-[18px] sm:w-[22px] sm:h-[22px]" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3" />
                </svg>
            </button>

            <!-- Favorites Filter -->
            <button id="filterBtn" class="click-feedback p-2 sm:p-3 hover:bg-black/5 rounded-full transition-all">
                <svg id="filterIcon" class="favorite-icon w-[18px] h-[18px] sm:w-[22px] sm:h-[22px]"
                    xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                </svg>
            </button>

            <!-- Settings Button -->
            <button id="settingsBtn" class="click-feedback p-2 sm:p-3 hover:bg-black/5 rounded-full transition-all">
                <svg class="w-[18px] h-[18px] sm:w-[22px] sm:h-[22px]" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Photo Grid -->
    <main id="galleryGrid"
        class="max-w-7xl mx-auto columns-2 md:columns-3 lg:columns-3 gap-6 pb-20 transition-all duration-300">
        <!-- Photos will be loaded here -->
    </main>

    <!-- Lightbox (Unified with Viewer) -->
    <div id="fullscreenViewer" class="overlay">
        <button id="closeViewer"
            class="click-feedback absolute top-6 right-6 text-white p-4 bg-white/10 hover:bg-white/20 rounded-full z-[1100] backdrop-blur-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>

        <div id="swipeArea" class="relative w-full h-full flex flex-col items-center justify-center px-4">
            <img id="viewerImage" src="" alt="Fullscreen image">

            <div id="viewerControls"
                class="mt-10 flex gap-4 bg-white/10 backdrop-blur-3xl p-3 rounded-full border border-white/20">
                <button id="viewerSlideshowBtn" class="click-feedback bg-white/10 text-white p-5 rounded-full">
                    <svg id="viewerPlayIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5 3 19 12 5 21 5 3" />
                    </svg>
                    <svg id="viewerPauseIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="4" width="4" height="16" />
                        <rect x="14" y="4" width="4" height="16" />
                    </svg>
                </button>
                <button id="viewerFavBtn" class="click-feedback bg-white/10 text-white p-5 rounded-full">
                    <svg id="viewerFavIcon" class="favorite-icon" xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                    </svg>
                </button>
                <button id="viewerDeleteBtn" class="click-feedback bg-red-500/80 text-white p-5 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settingsDialog" class="dialog-container">
        <div class="material-dialog">
            <h3 class="text-3xl font-black mb-8 tracking-tight">Einstellungen</h3>

            <div class="space-y-6">
                <div class="bg-[var(--md-sys-color-surface-container)] p-6 rounded-3xl">
                    <div class="flex justify-between text-xs font-bold uppercase text-gray-500 mb-4 tracking-wider">
                        <span>Tempo</span>
                        <span id="speedLabel" class="text-[var(--md-sys-color-primary)]">3.5s</span>
                    </div>
                    <input type="range" id="slideshowSpeed" min="1" max="10" step="0.5" value="3.5">
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Zufallswiedergabe</span>
                    <label class="switch click-feedback">
                        <input type="checkbox" id="shuffleToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Endlosschleife</span>
                    <label class="switch click-feedback">
                        <input type="checkbox" id="loopToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Galerie scannen</span>
                    <button id="rescanBtn"
                        class="click-feedback p-2 bg-[var(--md-sys-color-primary)] text-white rounded-xl">
                        Scan
                    </button>
                </div>
            </div>

            <button id="closeSettingsBtn"
                class="click-feedback mt-8 w-full py-5 bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] font-bold rounded-3xl shadow-lg">
                Fertig
            </button>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div id="deleteDialog" class="dialog-container">
        <div class="material-dialog text-center">
            <h3 class="text-3xl font-black mb-3">Foto löschen?</h3>
            <p class="text-[var(--md-sys-color-on-surface-variant)] text-sm mb-8 opacity-70">
                Das Foto wird dauerhaft aus deiner Sammlung entfernt.
            </p>
            <div class="flex flex-col gap-4">
                <button id="confirmDeleteBtn"
                    class="click-feedback w-full py-5 bg-[var(--md-sys-color-error)] text-[var(--md-sys-color-on-error)] font-bold rounded-3xl shadow-lg">
                    Löschen
                </button>
                <button id="cancelDeleteBtn"
                    class="click-feedback w-full py-4 text-[var(--md-sys-color-primary)] font-bold">
                    Abbrechen
                </button>
            </div>
        </div>
    </div>

    <!-- Slideshow Indicator -->
    <div id="slideshowIndicator"
        class="fixed bottom-8 sm:bottom-12 left-1/2 -translate-x-1/2 bg-[var(--md-sys-color-primary)] px-6 sm:px-8 py-3 sm:py-4 rounded-full text-[var(--md-sys-color-on-primary)] font-bold text-xs uppercase tracking-wider z-[2000] shadow-2xl hidden items-center gap-3 border border-white/20 backdrop-blur-lg">
        <span class="relative flex h-3 w-3 flex-shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
        </span>
        <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-3">
            <span class="text-[10px] sm:text-xs whitespace-nowrap">Diashow läuft</span>
            <span id="slideshowProgressLabel" class="text-[10px] sm:text-xs opacity-80 whitespace-nowrap">Foto 1 /
                9</span>
        </div>
        <button id="stopSlideshowBtn"
            class="click-feedback ml-2 p-1.5 hover:bg-white/20 rounded-full transition-all flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
            </svg>
        </button>
    </div>

    <!-- App Logic -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/gestures.js"></script>
    <script src="/static/js/slideshow.js"></script>
    <script src="/static/js/gallery.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
