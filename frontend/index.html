<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>P.I.X.I. | Material You Gallery</title>

    <!-- PWA -->
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#FEF7FF">

    <!-- External Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Local Styles -->
    <link rel="stylesheet" href="/static/css/material-you.css">
    <link rel="stylesheet" href="/static/css/animations.css">
</head>

<body class="px-4 sm:px-8 md:px-12 pb-12">

    <!-- Header / Top App Bar -->
    <header id="mainHeader" class="sticky top-0 z-50 transition-all duration-500 pt-8 pb-4">
        <div class="max-w-7xl mx-auto flex flex-col gap-6">
            <!-- Top Row: Actions -->
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div
                        class="w-10 h-10 bg-[var(--md-sys-color-primary)] rounded-full flex items-center justify-center text-white shadow-lg">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path
                                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                            <circle cx="12" cy="13" r="4" />
                        </svg>
                    </div>
                </div>

                <div
                    class="flex items-center gap-2 bg-[var(--md-sys-color-surface-container-high)] p-1 rounded-full shadow-sm">
                    <!-- Dark Mode Toggle -->
                    <button id="themeToggle" class="click-feedback p-3 hover:bg-black/5 rounded-full transition-all">
                        <svg id="themeIcon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                        </svg>
                    </button>

                    <div class="w-[1px] h-4 bg-gray-400 mx-1 opacity-20"></div>

                    <!-- Grid View -->
                    <div class="relative">
                        <button id="viewToggle"
                            class="click-feedback flex items-center gap-2 hover:bg-black/5 px-4 py-2 rounded-full transition-all">
                            <span id="currentViewLabel" class="font-bold text-sm">5</span>
                            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2.5">
                                <rect x="3" y="3" width="7" height="7" />
                                <rect x="14" y="3" width="7" height="7" />
                                <rect x="14" y="14" width="7" height="7" />
                                <rect x="3" y="14" width="7" height="7" />
                            </svg>
                        </button>
                        <div id="viewPopover">
                            <button class="view-option click-feedback" data-cols="1">1</button>
                            <button class="view-option click-feedback" data-cols="2">2</button>
                            <button class="view-option click-feedback" data-cols="3">3</button>
                            <button class="view-option click-feedback" data-cols="4">4</button>
                            <button class="view-option click-feedback active" data-cols="5">5</button>
                        </div>
                    </div>

                    <div class="w-[1px] h-4 bg-gray-400 mx-1 opacity-20"></div>

                    <!-- Settings -->
                    <button id="settingsBtn" class="click-feedback p-3 hover:bg-black/5 rounded-full transition-all">
                        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3" />
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                    </button>

                    <!-- Music Group (Placeholder for logic) -->
                    <button class="click-feedback p-3 hover:bg-black/5 rounded-full transition-all text-gray-400">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18V5l12-2v13" />
                            <circle cx="6" cy="18" r="3" />
                            <circle cx="18" cy="16" r="3" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Bottom Row: Big Title -->
            <div id="headerTitleContainer" class="flex items-end justify-between transition-all duration-500">
                <h1 id="mainTitle" class="text-6xl sm:text-7xl font-black tracking-tight select-none">Galerie</h1>

                <div class="flex items-center gap-3">
                    <button id="filterBtn"
                        class="click-feedback p-4 bg-[var(--md-sys-color-secondary-container)] text-[var(--md-sys-color-on-secondary-container)] rounded-3xl shadow-sm transition-all hover:shadow-md">
                        <svg id="filterIcon" class="favorite-icon w-6 h-6" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path
                                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                        </svg>
                    </button>
                    <button id="slideshowBtn"
                        class="click-feedback p-4 bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] rounded-3xl shadow-lg transition-all hover:scale-105">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Photo Grid -->
    <main id="galleryGrid" class="max-w-7xl mx-auto pb-20 transition-all duration-300">
        <!-- Photos will be loaded here -->
    </main>

    <!-- Lightbox (Unified with Viewer) -->
    <div id="fullscreenViewer" class="overlay">
        <!-- Image Container -->
        <div id="swipeArea" class="relative w-full h-full flex items-center justify-center">
            <img id="viewerImage" src="" alt="Fullscreen image">
        </div>

        <!-- Top Controls (Auto-hide) -->
        <div class="viewer-controls-overlay viewer-top-controls">
            <div class="flex flex-col items-end gap-3">
                <div class="flex gap-3">
                    <button id="closeViewer"
                        class="click-feedback text-white p-4 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-md transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                    <button id="viewerMenuToggle"
                        class="click-feedback text-white p-4 bg-white/10 hover:bg-white/20 rounded-full backdrop-blur-md transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="1" fill="currentColor" />
                            <circle cx="12" cy="5" r="1" fill="currentColor" />
                            <circle cx="12" cy="19" r="1" fill="currentColor" />
                        </svg>
                    </button>
                </div>

                <!-- Vertical Actions Menu (Dropdown style) -->
                <div id="viewerActionsMenu" class="viewer-actions-menu">
                    <div
                        class="flex flex-col gap-3 bg-white/10 backdrop-blur-3xl p-2 rounded-3xl border border-white/20">
                        <button id="viewerSlideshowBtn"
                            class="viewer-action-btn click-feedback bg-white/10 text-white p-4 rounded-full hover:bg-white/20 transition-all"
                            title="Diashow">
                            <svg id="viewerPlayIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            <svg id="viewerPauseIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20"
                                height="20" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                        </button>
                        <button id="viewerFavBtn"
                            class="viewer-action-btn click-feedback bg-white/10 text-white p-4 rounded-full hover:bg-white/20 transition-all"
                            title="Favorit">
                            <svg id="viewerFavIcon" class="favorite-icon" xmlns="http://www.w3.org/2000/svg" width="20"
                                height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                            </svg>
                        </button>
                        <button id="viewerDeleteBtn"
                            class="viewer-action-btn click-feedback bg-red-500/80 text-white p-4 rounded-full hover:bg-red-600/80 transition-all"
                            title="Löschen">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 6h18" />
                                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Image Info (Auto-hide) -->
        <div id="viewerInfo" class="viewer-controls-overlay viewer-info">
            <span id="viewerInfoText">Bild 1 von 100</span>
        </div>
    </div>

    <!-- Settings Dialog -->
    <div id="settingsDialog" class="dialog-container">
        <div class="material-dialog">
            <h3 class="text-3xl font-black mb-8 tracking-tight">Einstellungen</h3>

            <div class="space-y-6">
                <div class="bg-[var(--md-sys-color-surface-container)] p-6 rounded-3xl">
                    <div class="flex justify-between text-xs font-bold uppercase text-gray-500 mb-4 tracking-wider">
                        <span>Tempo</span>
                        <span id="speedLabel" class="text-[var(--md-sys-color-primary)]">3.5s</span>
                    </div>
                    <input type="range" id="slideshowSpeed" min="1" max="10" step="0.5" value="3.5">
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Zufallswiedergabe</span>
                    <label class="switch click-feedback">
                        <input type="checkbox" id="shuffleToggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Endlosschleife</span>
                    <label class="switch click-feedback">
                        <input type="checkbox" id="loopToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div
                    class="flex items-center justify-between p-6 bg-[var(--md-sys-color-surface-container)] rounded-3xl">
                    <span class="font-bold">Galerie scannen</span>
                    <button id="rescanBtn"
                        class="click-feedback p-2 bg-[var(--md-sys-color-primary)] text-white rounded-xl">
                        Scan
                    </button>
                </div>
            </div>

            <button id="closeSettingsBtn"
                class="click-feedback mt-8 w-full py-5 bg-[var(--md-sys-color-primary)] text-[var(--md-sys-color-on-primary)] font-bold rounded-3xl shadow-lg">
                Fertig
            </button>
        </div>
    </div>

    <!-- Delete Confirmation -->
    <div id="deleteDialog" class="dialog-container">
        <div class="material-dialog text-center">
            <h3 class="text-3xl font-black mb-3">Foto löschen?</h3>
            <p class="text-[var(--md-sys-color-on-surface-variant)] text-sm mb-8 opacity-70">
                Das Foto wird dauerhaft aus deiner Sammlung entfernt.
            </p>
            <div class="flex flex-col gap-4">
                <button id="confirmDeleteBtn"
                    class="click-feedback w-full py-5 bg-[var(--md-sys-color-error)] text-[var(--md-sys-color-on-error)] font-bold rounded-3xl shadow-lg">
                    Löschen
                </button>
                <button id="cancelDeleteBtn"
                    class="click-feedback w-full py-4 text-[var(--md-sys-color-primary)] font-bold">
                    Abbrechen
                </button>
            </div>
        </div>
    </div>

    <!-- Slideshow Indicator -->
    <div id="slideshowIndicator"
        class="fixed bottom-8 sm:bottom-12 left-1/2 -translate-x-1/2 bg-[var(--md-sys-color-primary)] px-6 sm:px-8 py-3 sm:py-4 rounded-full text-[var(--md-sys-color-on-primary)] font-bold text-xs uppercase tracking-wider z-[2000] shadow-2xl hidden items-center gap-3 border border-white/20 backdrop-blur-lg">
        <span class="relative flex h-3 w-3 flex-shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
        </span>
        <div class="flex flex-col sm:flex-row items-center gap-1 sm:gap-3">
            <span class="text-[10px] sm:text-xs whitespace-nowrap">Diashow läuft</span>
            <span id="slideshowProgressLabel" class="text-[10px] sm:text-xs opacity-80 whitespace-nowrap">Foto 1 /
                9</span>
        </div>
        <button id="stopSlideshowBtn"
            class="click-feedback ml-2 p-1.5 hover:bg-white/20 rounded-full transition-all flex-shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" />
                <rect x="14" y="4" width="4" height="16" />
            </svg>
        </button>
    </div>

    <!-- App Logic -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/gestures.js"></script>
    <script src="/static/js/slideshow.js"></script>
    <script src="/static/js/gallery.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/app.js"></script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</body>

</html>
